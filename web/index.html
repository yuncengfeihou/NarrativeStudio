<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FCFCFB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="叙事台" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="叙事台：以世界卡驱动的长篇剧情演绎工作台。" />
  <title>叙事台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231C1B19'/%3E%3Cpath d='M20 44V20h5v9.5h14V20h5v24h-5v-9.5H25V44z' fill='%23FCFCFB'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/shell.css" />
  <link rel="stylesheet" href="/styles/views.css" />
  <link rel="stylesheet" href="/styles/chat.css" />
  <link rel="stylesheet" href="/styles/panels.css" />
  <script>
    /* 首屏前解析主题，避免深色模式闪白 */
    (function () {
      try {
        var raw = localStorage.getItem('narra.prefs.v3');
        var theme = raw ? (JSON.parse(raw).theme || 'system') : 'system';
        var dark = theme === 'dark' || (theme === 'system' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#171614' : '#FCFCFB');
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="主导航"></nav>
    <div id="subbar-scrim" class="subbar-scrim" hidden></div>
    <aside id="subbar" class="subbar" aria-label="目录"></aside>

    <main id="main" class="main">
      <div class="view is-active" id="boot">
        <div class="scroll" style="display:flex;align-items:center;justify-content:center;">
          <div class="col" style="align-items:center;gap:10px;color:var(--ink-3);">
            <span class="spinner"></span>
            <span style="font-size:var(--fs-caption);">正在载入</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
