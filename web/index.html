<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FCFCFB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="叙事台" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="叙事台：以世界卡驱动的长篇剧情演绎工作台。" />
  <title>叙事台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231C1B19'/%3E%3Cpath d='M20 44V20h5v9.5h14V20h5v24h-5v-9.5H25V44z' fill='%23FCFCFB'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/shell.css" />
  <link rel="stylesheet" href="/styles/views.css" />
  <link rel="stylesheet" href="/styles/chat.css" />
  <link rel="stylesheet" href="/styles/panels.css" />
  <script>
    /* 首屏前解析偏好：主题避免闪白，字体与字号避免重排。
       这里的字体栈规则必须与 store.js → applyAppearancePrefs 保持一致。 */
    (function () {
      try {
        var raw = localStorage.getItem('narra.prefs.v4');
        var prefs = raw ? JSON.parse(raw) : {};
        var theme = prefs.theme || 'system';
        var dark = theme === 'dark' || (theme === 'system' &&
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('data-theme', dark ? 'dark' : 'light');
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#171614' : '#FCFCFB');

        function stack(value, fallback) {
          var v = String(value || '').trim();
          if (!v) return '';
          if (v.indexOf(',') === -1) v = '"' + v.replace(/"/g, '\\"') + '"';
          return v + ', ' + fallback;
        }
        var uiFont = prefs.uiFont != null ? prefs.uiFont : prefs.titleFont;
        var ui = stack(uiFont, 'var(--font-ui-base)');
        if (ui) root.style.setProperty('--font-ui', ui);
        var read = stack(prefs.readingFont, 'var(--font-read-base)');
        if (read) root.style.setProperty('--font-read', read);

        var widths = { compact: '34em', normal: '42em', wide: '50em' };
        root.style.setProperty('--read-max', widths[prefs.readingWidth] || widths.normal);
        if (prefs.readingSize) root.style.setProperty('--fs-read', prefs.readingSize + 'px');
      } catch (e) { /* 忽略 */ }
    })();
  </script>
</head>
<body>
  <div id="app" class="app">
    <nav id="rail" class="rail" aria-label="主导航"></nav>
    <div id="subbar-scrim" class="subbar-scrim" hidden></div>
    <aside id="subbar" class="subbar" aria-label="目录"></aside>

    <main id="main" class="main">
      <div class="view is-active" id="boot">
        <div class="scroll" style="display:flex;align-items:center;justify-content:center;">
          <div class="col" style="align-items:center;gap:10px;color:var(--ink-3);">
            <span class="spinner"></span>
            <span style="font-size:var(--fs-caption);">正在载入</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>

  <script>
    // 启动期错误显形：模块求值/动态 import 失败时，把错误写进 #boot，
    // 避免静默停在「正在载入」。app.js 的 boot() 还会再包一层。
    window.__bootErrors = [];
    window.addEventListener('error', (e) => {
      window.__bootErrors.push((e.message || 'error') + ' @ ' + (e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', (e) => {
      const r = e.reason;
      window.__bootErrors.push('unhandled: ' + ((r && r.stack) ? r.stack.split('\n').slice(0, 2).join(' | ') : String(r)));
    });
    setTimeout(() => {
      const boot = document.getElementById('boot');
      if (boot && window.__bootErrors.length) {
        const box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;max-height:45%;overflow:auto;padding:12px;border-radius:10px;background:#7f1d1d;color:#fff;font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;z-index:9999;';
        box.textContent = window.__bootErrors.join('\n');
        document.body.appendChild(box);
      }
    }, 2500);
  </script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
